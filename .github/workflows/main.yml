name: Deploy to OVH

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint:all

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    concurrency: deploy-production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t isard:current .

      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ovh\n  HostName fryzhen.fr\n  User debian\n  IdentityFile ~/.ssh/deploy\n  BatchMode yes\n  ServerAliveInterval 30\n' > ~/.ssh/config

      - name: Ship and Start
        run: |
          set -euo pipefail
          ssh ovh 'mkdir -p /opt/stacks/isard && cat > /opt/stacks/isard/compose.yaml' < deploy/compose.yaml
          # Garde l'image en cours sous isard:previous : rollback = retag + compose up
          ssh ovh 'docker tag isard:current isard:previous 2>/dev/null || true'
          docker save isard:current | gzip | ssh ovh 'docker load'
          ssh ovh 'cd /opt/stacks/isard && docker compose up -d && docker image prune -f'

      - name: Check the Site
        run: |
          for i in $(seq 10); do
            curl -fsS --max-time 20 https://iracing.fryzhen.fr/ | grep -q '<isard-root' && exit 0
            sleep 6
          done
          echo "::error::https://iracing.fryzhen.fr ne sert pas l'app"
          exit 1
